name: CD - Deploy to Azure Storage

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Azure Blob Storage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display project files
        run: |
          echo "📦 Prepare to deploy the following files:"
          ls -la
          echo ""
          echo "✅ File check completed"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upload files to Azure Blob Storage
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
        run: |
          echo "🚀 Starting to upload files to Azure Blob Storage..."
          azcopy sync "." "https://${AZURE_STORAGE_ACCOUNT}.blob.core.windows.net/\$web" \
            --delete-destination=true \
            --exclude-path=".git;.github" \
            --exclude-pattern="*.md" \
            --auth-mode=Login
          echo "✅ Upload completed!"

      - name: Display deployment result
        run: |
          echo "🎉 Deployment successful!"

  check:
    name: Check Website
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Check website status
        run: |
          echo "🔍 Checking website accessibility..."
          sleep 5
          URL="${{ secrets.AZURE_STATIC_WEBSITE_URL }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          if [ $STATUS -eq 200 ]; then
            echo "✅ Website is accessible! (HTTP $STATUS)"
            echo "🌐 Visit: $URL"
          else
            echo "❌ Website is not accessible (HTTP $STATUS)"
            exit 1
          fi
