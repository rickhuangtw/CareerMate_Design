name: CD - Deploy to AWS S3

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-2

jobs:
  deploy:
    name: Deploy to AWS S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display project files
        run: |
          echo "📦 Prepare to deploy the following files:"
          ls -la
          echo ""
          echo "✅ File check completed"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload files to S3
        run: |
          echo "🚀 Starting to upload files to S3..."
          aws s3 sync . s3://${{ secrets.S3_BUCKET_NAME }}/ \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "*.md"
          echo "✅ Upload completed!"

      - name: Display deployment result
        run: |
          echo "🎉 Deployment successful!"

  check:
    name: Check Website
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Check website status
        run: |
          echo "🔍 Checking website accessibility..."
          sleep 5
          URL="http://${{ secrets.S3_BUCKET_NAME }}.s3-website-${{ env.AWS_REGION }}.amazonaws.com"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" $URL)
          if [ $STATUS -eq 200 ]; then
            echo "✅ Website is accessible! (HTTP $STATUS)"
            echo "🌐 Visit: $URL"
          else
            echo "❌ Website is not accessible (HTTP $STATUS)"
            exit 1
          fi