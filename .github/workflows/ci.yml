name: CI - Continuous Integration

# trigger conditions
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # job 1: code quality check
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: |
          npm install -g htmlhint stylelint stylelint-config-standard
      
      - name: Lint HTML
        run: |
          htmlhint "*.html" || echo "HTML Check completed"
      
      - name: Lint CSS
        run: |
          npx stylelint "**/*.css" --config-basedir . || echo "CSS Check completed"
        continue-on-error: true

# Job 2: build validation
  build:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify project structure
        run: |
          echo "✅ Verifying project structure..."
          test -f index.html && echo "✓ index.html Exits"
          test -f styles.css && echo "✓ styles.css Exits"
          test -f app.js && echo "✓ app.js Exits"
          test -d assets && echo "✓ assets Folder Exits"
      
      - name: Check file sizes
        run: |
          echo "📊 Checking file sizes..."
          find . -name "*.html" -o -name "*.css" -o -name "*.js" | while read file; do
            size=$(wc -c < "$file")
            echo "$(basename $file): ${size} bytes"
          done

# Job 3: deploy preview
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment message
        run: |
          echo "🚀 Prepare to deploy preview environment..."
          echo "Branch: ${{ github.head_ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "📝 Here can integrate Netlify, Vercel and other deployment services"

  # Job 4: security check
  security:
    name: Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for sensitive data
        run: |
          echo "🔒 Checking for sensitive information..."
          # Check for API keys, passwords, and secrets
          if grep -r "API_KEY\|password\|secret" --include="*.js" --include="*.html" .; then
            echo "⚠️  Warning: Possible sensitive information found"
            exit 1
          else
            echo "✅ No sensitive information found"
          fi